name: Release

# Publishes to PyPI on a version tag (e.g. `v0.1.0`), using PyPI Trusted
# Publishing (OIDC) — no long-lived API token lives in the repo — and PEP 740
# attestations for supply-chain provenance.
#
# One-time setup (cannot be done from code):
#   1. Create the project's Trusted Publisher on PyPI:
#      PyPI → project → Publishing → add GitHub publisher
#      (owner=<org>, repo=messy-table, workflow=release.yml, environment=pypi).
#   2. Create a GitHub environment named `pypi` (Settings → Environments),
#      ideally with required reviewers for release protection.
#   3. Push a signed, annotated tag: `git tag -s v0.1.0 -m v0.1.0 && git push --tags`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for trusted publishing — replaces any secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — the OIDC identity authenticates. Attestations (PEP 740)
        # are generated by default, giving published artifacts provenance.
