name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint + types (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff lint
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: tests py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Windows matters here: encoding and path handling. Coverage gate enforced.
      - name: pytest (functional + coverage gate)
        run: pytest -m "not perf" --cov=messy_table --cov-report=term-missing

  perf:
    name: performance gate (50k x 30, regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest (perf)
        # The 5 s product SLA is for reference dev hardware. Shared CI runners are
        # slower and variable, and openpyxl's pure-Python read is the floor, so here
        # the gate is a regression guard (catches catastrophic blow-ups) with a
        # looser budget. See tests/test_perf.py / ARCHITECTURE.md.
        env:
          MESSY_TABLE_PERF_BUDGET_SECONDS: "15"
        run: pytest -m perf

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: verify clean install (no pandas)
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import messy_table; print('clean import ok', messy_table.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
